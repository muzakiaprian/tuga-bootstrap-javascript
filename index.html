<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Muhammad Muzaki Aprian</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .hero {
            background: linear-gradient(135deg, #212529, #495057);
            color: white;
            padding: 50px 20px;
            border-radius: 0 0 25px 25px;
        }

        .profile-card {
            margin-top: -50px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
        }

        .sembunyi {
            display: none;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <section class="hero text-center">
        <h1>Profil Mahasiswa</h1>
        <p>Website Profil Muhammad Muzaki Aprian</p>
    </section>

    <!-- Profil -->
    <div class="container">
        <div class="card shadow profile-card">
            <div class="card-body text-center">

                <img src="1482500050.jpg" alt="Foto Profil" class="profile-img mb-3">

                <h2>Muhammad Muzaki Aprian</h2>
                <p class="text-muted">Mahasiswa Sistem dan Teknologi Informasi</p>

            </div>
        </div>
    </div>

    <!-- Data Nilai -->
    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Daftar Nilai</h3>

            <input
                type="text"
                id="cari"
                class="form-control w-50"
                placeholder="Cari mata kuliah..."
            >
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>No</th>
                        <th>Mata Kuliah</th>
                        <th>Nilai</th>
                    </tr>
                </thead>

                <tbody id="tabelNilai"></tbody>
            </table>
        </div>
    </div>

    <!-- Form Tambah Nilai -->
    <div class="container mt-5">

        <div class="card shadow">
            <div class="card-body">

                <h3 class="mb-4">Tambah Mata Kuliah</h3>

                <form id="formNilai">

                    <div class="mb-3">
                        <label for="namaMataKuliah" class="form-label">
                            Nama Mata Kuliah
                        </label>

                        <input
                            type="text"
                            id="namaMataKuliah"
                            class="form-control"
                            placeholder="Masukkan nama mata kuliah"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="nilaiMataKuliah" class="form-label">
                            Nilai
                        </label>

                        <select id="nilaiMataKuliah" class="form-select">
                            <option value="">Pilih nilai</option>
                            <option value="A">A</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B">B</option>
                            <option value="B-">B-</option>
                            <option value="C">C</option>
                        </select>
                    </div>

                    <p id="pesanError"></p>

                    <button type="submit" class="btn btn-dark">
                        Tambah Data
                    </button>

                </form>

            </div>
        </div>
    </div>

    <!-- Data IPK -->
    <div class="container mt-5 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Data IPK</h3>

            <button id="tombolIPK" class="btn btn-primary">
                Tampilkan IPK
            </button>
        </div>

        <div id="dataIPK">
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Semester</th>
                            <th>IPK</th>
                        </tr>
                    </thead>

                    <tbody id="tabelIPK"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Muhammad Muzaki Aprian</p>
    </footer>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
